  <line x1="18" y1="32" x2="18" y2="48" stroke="#ffffff" stroke-width="2"/>
  <path d="M38 56 L48 50 L38 46 Z" fill="#ffd43b"/>
  <line x1="38" y1="46" x2="38" y2="62" stroke="#ffffff" stroke-width="2"/>

  <!-- 3D Bomb -->
  <circle cx="70" cy="58" r="20" fill="url(#bombGrad)"/>
