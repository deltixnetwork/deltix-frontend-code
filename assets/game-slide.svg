<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="slTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#74c0fc"/><stop offset="100%" stop-color="#1c7ed6"/>
    </linearGradient>
  </defs>
  <!-- Deltix Slide Puzzle — glossy number tiles with one sliding out -->
  <rect x="14" y="14" width="72" height="72" rx="10" fill="#0b3a6b" stroke="#a5d8ff" stroke-width="2.5"/>
  <rect x="20" y="20" width="28" height="28" rx="6" fill="url(#slTile)" stroke="#e7f5ff" stroke-width="1.5"/>
  <rect x="52" y="20" width="28" height="28" rx="6" fill="url(#slTile)" stroke="#e7f5ff" stroke-width="1.5"/>
  <rect x="20" y="52" width="28" height="28" rx="6" fill="url(#slTile)" stroke="#e7f5ff" stroke-width="1.5"/>
  <rect x="58" y="58" width="28" height="28" rx="6" fill="#ffd43b" stroke="#f08c00" stroke-width="2" transform="rotate(-6 72 72)"/>
  <text x="34" y="40" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-weight="900" font-size="16" fill="#fff">1</text>
  <text x="66" y="40" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-weight="900" font-size="16" fill="#fff">2</text>
  <text x="34" y="72" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-weight="900" font-size="16" fill="#fff">3</text>
  <text x="72" y="76" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-weight="900" font-size="16" fill="#7a4c00" transform="rotate(-6 72 72)">4</text>
</svg>