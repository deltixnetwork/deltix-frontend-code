<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deltix Network — Whitepaper</title>
  <meta name="description" content="The Deltix Network whitepaper: mobile-first Delegated Proof of Stake, tokenomics, referrals, DAO governance, and Deltix Energy." />
  <style>
    :root {
      --bg: #f4f6fa; --panel: #ffffff; --border: #e6eaf2; --text: #101828;
      --muted: #667085; --accent: #2f6bff; --accent-2: #7c3aed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: radial-gradient(1200px 560px at 50% -240px, #f8fbff 20%, #eef2fa 70%, #e6ebf5 100%);
      color: var(--text); font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
      line-height: 1.65;
    }
    .topbar {
      position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; background: rgba(255,255,255,.9); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: .5px; color: #0f172a; }
    .brand .d { color: var(--accent); font-size: 20px; }
    .back { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600; border: 1px solid var(--border); padding: 7px 14px; border-radius: 999px; background: #fff; }
    .back:hover { color: var(--text); border-color: var(--accent); }
    .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }
    .hero { text-align: center; padding: 24px 0 8px; }
    .hero h1 { font-size: 34px; margin: 6px 0; color: #0f172a; }
    .hero .sub { color: var(--muted); font-size: 14px; }
    #doc { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 8px 22px 24px; box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06); }
    #doc h1 { font-size: 28px; margin: 34px 0 10px; color: #0f172a; }
    #doc h2 { font-size: 22px; margin: 30px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); color: #0f172a; }
    #doc h3 { font-size: 17px; margin: 22px 0 6px; color: #1f2937; }
    #doc h4 { font-size: 15px; margin: 16px 0 4px; color: var(--muted); }
    #doc p { margin: 10px 0; }
    #doc a { color: var(--accent); }
    #doc strong { color: #0f172a; }
    #doc code { background: #f1f5fb; border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; font-size: 13px; color: #1d4ed8; }
    #doc pre { background: #0f172a; border: 1px solid #0f172a; border-radius: 12px; padding: 14px 16px; overflow-x: auto; }
    #doc pre code { background: none; border: none; padding: 0; color: #cdd8f0; }
    #doc ul, #doc ol { margin: 10px 0; padding-left: 22px; }
    #doc li { margin: 5px 0; }
    #doc hr { border: none; border-top: 1px solid var(--border); margin: 26px 0; }
    #doc .tbl { overflow-x: auto; margin: 14px 0; border: 1px solid var(--border); border-radius: 12px; }
    #doc table { border-collapse: collapse; width: 100%; font-size: 14px; }
    #doc th, #doc td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    #doc th { background: #f4f7fd; color: #1f2937; }
    #doc tr:last-child td { border-bottom: none; }
    .loading { color: var(--muted); text-align: center; padding: 40px; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="d">◆</span> Deltix Network</div>
    <a class="back" href="/">← Back</a>
  </div>
  <div class="wrap">
    <div class="hero">
      <h1>Deltix Network Whitepaper</h1>
      <div class="sub">Mobile-first Delegated Proof of Stake · live from day one</div>
    </div>
    <div id="doc"><p class="loading">Loading whitepaper…</p></div>
  </div>
  <footer>© 2026 Deltix Network · $DLTX is an in-app utility token with no monetary value.</footer>

  <script>
    function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function inline(s) {
      s = escapeHtml(s);
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      return s;
    }
    function isBlockStart(l) { return /^(#{1,6}\s|\s*[-*]\s|\s*\d+\.\s|\||```|---)/.test(l); }
    function render(md) {
      const lines = md.replace(/\r/g, '').split('\n');
      let html = '', i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (/^```/.test(line)) {
          const buf = []; i++;
          while (i < lines.length && !/^```/.test(lines[i])) { buf.push(escapeHtml(lines[i])); i++; }
          i++; html += '<pre><code>' + buf.join('\n') + '</code></pre>'; continue;
        }
        if (/^\|/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|?\s*$/.test(lines[i + 1].trim())) {
          const header = line.split('|').slice(1, -1).map((c) => c.trim());
          i += 2; const rows = [];
          while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1).map((c) => c.trim())); i++; }
          html += '<div class="tbl"><table><thead><tr>' + header.map((h) => '<th>' + inline(h) + '</th>').join('') +
            '</tr></thead><tbody>' + rows.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') +
            '</tbody></table></div>';
          continue;
        }
        let m;
        if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) { const lv = m[1].length; html += '<h' + lv + '>' + inline(m[2]) + '</h' + lv + '>'; i++; continue; }
        if (/^---+\s*$/.test(line)) { html += '<hr/>'; i++; continue; }
        if (/^\s*[-*]\s+/.test(line)) {
          const buf = [];
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
            let item = lines[i].replace(/^\s*[-*]\s+/, ''); i++;
            while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) { item += ' ' + lines[i].trim(); i++; }
            buf.push('<li>' + inline(item) + '</li>');
          }
          html += '<ul>' + buf.join('') + '</ul>'; continue;
        }
        if (/^\s*\d+\.\s+/.test(line)) {
          const buf = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            let item = lines[i].replace(/^\s*\d+\.\s+/, ''); i++;
            while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) { item += ' ' + lines[i].trim(); i++; }
            buf.push('<li>' + inline(item) + '</li>');
          }
          html += '<ol>' + buf.join('') + '</ol>'; continue;
        }
        if (/^\s*$/.test(line)) { i++; continue; }
        const buf = [line]; i++;
        while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) { buf.push(lines[i]); i++; }
        html += '<p>' + inline(buf.join(' ')) + '</p>';
      }
      return html;
    }
    fetch('WHITEPAPER.md', { cache: 'no-cache' })
      .then((r) => { if (!r.ok) throw new Error('not found'); return r.text(); })
      .then((md) => { document.getElementById('doc').innerHTML = render(md); })
      .catch(() => { document.getElementById('doc').innerHTML = '<p class="loading">The whitepaper is temporarily unavailable. Please try again later.</p>'; });
  </script>
</body>
</html>
